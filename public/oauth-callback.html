<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Authentication Callback</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border-left-color: #ef4444;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      font-size: 18px;
      margin: 0 0 8px 0;
      font-weight: 600;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Connecting your Google Account</h2>
  <p>Authenticating credentials. This window will close automatically...</p>

  <script>
    // Extract access_token or token parameters from hash or query search params
    const hash = window.location.hash;
    const search = window.location.search;
    
    let accessToken = null;
    let idToken = null;

    if (hash) {
      const params = new URLSearchParams(hash.substring(1));
      accessToken = params.get('access_token');
      idToken = params.get('id_token');
    }

    if (!accessToken && search) {
      const params = new URLSearchParams(search);
      accessToken = params.get('access_token');
      idToken = params.get('id_token');
    }

    if (accessToken) {
      if (window.opener) {
        // Post the access token back to the parent window
        window.opener.postMessage({ 
          type: 'OAUTH_AUTH_SUCCESS', 
          provider: 'google', 
          accessToken: accessToken,
          idToken: idToken 
        }, '*');
      }
    } else {
      if (window.opener) {
        window.opener.postMessage({ 
          type: 'OAUTH_AUTH_FAILURE', 
          provider: 'google',
          error: 'Access token not found in callback parameters'
        }, '*');
      }
    }

    // Give a split second before closing for message transmission
    setTimeout(() => {
      window.close();
    }, 400);
  </script>
</body>
</html>
